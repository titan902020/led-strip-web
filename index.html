<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лента</title>
<script>
// Показывает любую ошибку прямо на экране (для отладки в Bluefy).
window.addEventListener('error', function (e) {
  var d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;margin:0;padding:10px;background:#900;color:#fff;font:13px monospace;white-space:pre-wrap';
  d.textContent = 'ОШИБКА: ' + e.message + ' (строка ' + e.lineno + ')';
  (document.body || document.documentElement).appendChild(d);
});
</script>
<style>
  html{background:#0b0c10}
  :root{--bg:#0b0c10;--card:rgba(26,28,36,.72);--line:rgba(255,255,255,.09);--text:#eceef3;--mute:#8b90a0;--acc:#4f8cff;--glow:rgb(255,0,120)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,system-ui,sans-serif;overflow:hidden}
  /* живое свечение за интерфейсом: цвет повторяет цвет ленты */
  .glow{position:fixed;inset:-20% -10% auto -10%;height:70%;z-index:0;pointer-events:none;
        background:radial-gradient(ellipse at 50% 0%,var(--glow) 0%,transparent 65%);opacity:.45;
        transition:background .25s linear,opacity .4s}
  .glow.fxrun{animation:hue 6s linear infinite}
  .glow.off{opacity:.12}
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  .app{position:relative;z-index:1;height:100dvh;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;
       padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:10px}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
  .chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;
        padding:6px 12px;font-size:13px;color:var(--mute);max-width:100%;backdrop-filter:blur(10px)}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:#666;flex:none}
  .chip.ok .dot{background:#5ad17a;box-shadow:0 0 8px #5ad17a;animation:pulse 2s infinite}
  .chip.err .dot{background:#ff7a7a}
  .chip.ok{color:#bfe9ca}.chip.err{color:#ffb0b0}
  @keyframes pulse{50%{opacity:.4}}
  button{font:inherit;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;
         padding:10px 14px;cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s}
  button:hover{background:rgba(255,255,255,.14)}
  button:active{transform:scale(.96)}
  button.primary{background:var(--acc);border-color:transparent;color:#fff;font-weight:600}
  button.small{padding:6px 10px;font-size:13px}
  button.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(79,140,255,.35)}
  .pw{display:flex;gap:6px}
  .pw button{padding:7px 12px;font-size:13px}
  .connect{display:flex;align-items:center;gap:8px;margin-top:8px}
  .chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--mute);font-size:13px;list-style:none;padding:6px 0;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";display:inline-block;transition:transform .2s}
  details[open]>summary::before{transform:rotate(90deg)}
  details[open]>.more{animation:drop .25s ease}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}}
  #panel{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:10px;transition:opacity .3s}
  #panel.off{opacity:.4;pointer-events:none}
  .tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);
        border-radius:14px;padding:4px;backdrop-filter:blur(10px)}
  .tabs button{background:none;border:0;border-radius:10px;position:relative;z-index:1;padding:9px 4px;color:var(--mute)}
  .tabs button.act{color:#fff;font-weight:600}
  .tabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;
             background:linear-gradient(135deg,rgba(79,140,255,.9),rgba(160,0,255,.8));transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
  .stage{flex:1;min-height:0;overflow:auto;margin-top:10px;padding-bottom:4px}
  .tab{display:none;animation:in .3s ease}
  .tab.act{display:block}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;backdrop-filter:blur(10px)}
  label{display:block;font-size:12px;color:var(--mute);margin:0 0 6px}
  .grid2{display:grid;grid-template-columns:1fr;gap:10px}
  .sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .sw button{position:relative;aspect-ratio:1.5;padding:0;border-radius:12px;border:2px solid rgba(255,255,255,.14)}
  .sw button:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .sw.edit button{animation:wob .5s ease-in-out infinite alternate}
  @keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
  .sw.edit button::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:#fff;
       text-shadow:0 0 4px #000;background:rgba(0,0,0,.3);border-radius:10px}
  .empty{color:var(--mute);font-size:13px;grid-column:1/-1}
  input[type=range]{width:100%;height:28px;accent-color:var(--acc)}
  input[type=color]{width:100%;height:44px;border:0;border-radius:12px;background:none;padding:0;cursor:pointer}
  select{width:100%;padding:10px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line);font:inherit}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row>button{flex:1}
  .fx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .fx button{padding:8px 6px;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px;text-align:center;line-height:1.15;position:relative;overflow:hidden}
  .fx button .dots{display:flex;gap:3px;justify-content:center}
  .fx .dots i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.25)}
  .fx button:hover .dots i{animation:bob .6s ease infinite alternate}
  .fx button:hover .dots i:nth-child(2){animation-delay:.1s}.fx button:hover .dots i:nth-child(3){animation-delay:.2s}
  @keyframes bob{to{transform:translateY(-3px)}}
  .fx button.on{border-color:transparent;background:linear-gradient(#1c2030,#1c2030) padding-box,linear-gradient(120deg,#4f8cff,#ff0078,#ffc800,#4f8cff) border-box;
                border:2px solid transparent;background-size:100% 100%,300% 100%;animation:flow 3s linear infinite}
  @keyframes flow{to{background-position:0 0,300% 0}}
  #fxinfo{font-size:13px;color:var(--mute);min-height:34px;margin:10px 0 4px}
  #fxinfo b{color:var(--text)}
  .band{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px;transition:opacity .2s}
  #bands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .band .top{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
  .band .name{font-size:12px}
  .band .ctl{display:flex;gap:6px}
  .band .ctl .small{flex:1;padding:5px}
  .band .take{display:none}
  .band input[type=color]{height:36px}
  .band.none{opacity:.55}.band.none input[type=color]{opacity:.2;pointer-events:none}
  #presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:2px;scrollbar-width:none}
  #presets::-webkit-scrollbar{display:none}
  #presets button{flex:none;white-space:nowrap}
  #mic{width:100%;padding:14px;font-size:16px;font-weight:600;margin-top:4px}
  #mic.on{background:linear-gradient(135deg,#ff0078,#a000ff);border-color:transparent;animation:beat 1s ease-in-out infinite}
  @keyframes beat{50%{box-shadow:0 0 24px rgba(255,0,120,.6)}}
  .hint{font-size:12px;color:var(--mute);margin-top:6px}
  .bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
       padding:6px 14px;margin-top:8px;backdrop-filter:blur(10px)}
  .bar label{margin:0;white-space:nowrap}
  .bar input{flex:1}
  @media(min-width:760px){
    .app{padding:22px 28px}
    h1{font-size:22px}
    .grid2{grid-template-columns:1fr 1fr;gap:14px}
    .fx{grid-template-columns:repeat(4,1fr)}
    .sw{grid-template-columns:repeat(5,1fr)}
  }
  @media(max-height:620px){.fx button .dots{display:none}}
</style>
</head>
<body>
<div class="glow off" id="glow"></div>
<div class="app">
  <header>
    <h1>Лента</h1>
    <div class="pw"><button id="on" class="small">Вкл</button><button id="off" class="small">Выкл</button></div>
  </header>
  <div class="connect">
    <div class="chip" id="chip" style="flex:1"><span class="dot"></span><span id="status">Закройте duoCo Strip и нажмите «Подключить»</span></div>
    <button class="primary small" id="connect">Подключить</button>
  </div>
  <details style="margin:0"><summary>Не находит ленту?</summary><div class="more"><button class="small" id="connectAll">Показать все устройства</button></div></details>

  <div id="panel" class="off">
    <nav class="tabs" id="tabs">
      <div class="ind" id="ind"></div>
      <button class="act" data-t="color">Цвет</button>
      <button data-t="fxt">Эффекты</button>
      <button data-t="snd">Звук</button>
    </nav>

    <div class="stage">
      <section class="tab act" id="tab-color">
        <div class="grid2">
          <div class="card">
            <label>Избранные цвета</label>
            <div class="sw" id="swatches"></div>
            <details><summary>Изменить палитру</summary>
              <div class="more row" style="margin-top:6px">
                <button class="small" id="editFav">Изменить</button>
                <button class="small" id="addFav">★ Добавить выбранный</button>
                <button class="small" id="resetFav">Сбросить</button>
              </div>
            </details>
          </div>
          <div class="card">
            <label>Любой цвет</label>
            <input type="color" id="picker" value="#ff0078">
          </div>
        </div>
      </section>

      <section class="tab" id="tab-fxt">
        <div class="card">
          <div class="fx" id="fx"></div>
          <div id="fxinfo">Выберите эффект, здесь появится описание.</div>
          <label>Скорость: <span id="sval">50</span>%</label>
          <input type="range" id="speed" min="0" max="100" value="50">
        </div>
      </section>

      <section class="tab" id="tab-snd">
        <div class="card">
          <button id="mic">Включить режим</button>
          <div class="hint" style="margin:8px 0 6px">Цвета для басов, средних и высоких. «Убрать» делает полосу пустой, один цвет реагирует на весь звук.</div>
          <div id="presets"></div>
          <div id="bands"></div>
          <details><summary>Настройки реакции</summary>
            <div class="more">
              <label>Как реагировать</label>
              <select id="sndMode">
                <option value="bands">Полосы: цвет по частотам (мягко)</option>
                <option value="flash">Вспышки на бит (заметно)</option>
                <option value="cycle">Смена цвета на каждый бит (максимум)</option>
              </select>
              <label style="margin-top:10px">Яркость, не зависит от громкости: <span id="smaxv">100</span>%</label>
              <input type="range" id="smax" min="5" max="100" value="100">
              <label>Фон между вспышками: <span id="sminv">0</span>%</label>
              <input type="range" id="smin" min="0" max="80" value="0">
              <label>Чувствительность: <span id="sgainv">150</span>%</label>
              <input type="range" id="sgain" min="50" max="400" value="150">
            </div>
          </details>
        </div>
      </section>
    </div>

    <div class="bar"><label>Яркость <span id="bval">100</span>%</label><input type="range" id="bright" min="1" max="100" value="100"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SERVICES = ['fff0', 'ffe0', 'ffd0', 'ffd5', 'ffb0', 'fee0', 'ae00'].map(h => '0000' + h + '-0000-1000-8000-00805f9b34fb');
const PREFER = ['fff3', 'ffe1', 'ffd9', 'ffd5'];
const DEFAULT_FAV = ['#ff0000','#ff0078','#ff5000','#ffc800','#00ff00','#00ffff','#0000ff','#a000ff','#ff8c28','#ffffff'];
const DEFAULT_BANDS = ['#ff0078', '#ff0000', '#ffc800'];
const BAND_DEF = [
  {name: 'Басы (низкие)', lo: 30, hi: 200},
  {name: 'Средние', lo: 200, hi: 2000},
  {name: 'Высокие', lo: 2000, hi: 12000}
];
const KEY = 'ledstrip.v1';

let dev = null, chr = null, busy = false, pending = null, micOn = false, editMode = false;
let state = {fav: DEFAULT_FAV.slice(), bands: DEFAULT_BANDS.slice()};

try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && Array.isArray(s.fav) && Array.isArray(s.bands) && s.bands.length === 3) state = s;
} catch (e) {}
state.snd = Object.assign({mode: 'bands', max: 100, min: 0, gain: 150}, state.snd);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const pkt = (...b) => new Uint8Array([0x7e, 0x00, ...b, 0xef]);
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function setStatus(t, cls = '') { $('status').textContent = t; $('chip').className = 'chip ' + cls; $('glow').classList.toggle('off', !chr); }

// Последняя команда важнее старых: очередь не копится, ползунки не тормозят.
async function send(p) {
  if (!chr) return;
  if (busy) { pending = p; return; }
  busy = true;
  try {
    do {
      const cur = p; pending = null;
      if (chr.writeValueWithoutResponse) await chr.writeValueWithoutResponse(cur);
      else await chr.writeValue(cur);
      p = pending;
    } while (p);
  } catch (e) { setStatus('Ошибка отправки: ' + e.message, 'err'); }
  busy = false;
}
const turnOn = () => send(pkt(0x04, 0xf0, 0x00, 0x01, 0xff, 0x00));
const turnOff = () => send(pkt(0x04, 0x00, 0x00, 0x00, 0xff, 0x00));
const setRGB = (r, g, b) => {
  const k = Math.max(r, g, b) || 1, m = 255 / k;   // яркий цвет для свечения, даже если лента приглушена
  document.documentElement.style.setProperty('--glow', 'rgb(' + Math.round(r * m) + ',' + Math.round(g * m) + ',' + Math.round(b * m) + ')');
  $('glow').style.opacity = (0.15 + 0.5 * k / 255).toFixed(2);
  $('glow').classList.remove('fxrun');
  send(pkt(0x05, 0x03, r, g, b, 0x00));
};

async function connect(all) {
  if (!navigator.bluetooth) {
    setStatus('Этот браузер не поддерживает Bluetooth. Откройте страницу в Bluefy.', 'err'); return;
  }
  try {
    setStatus('Выбор устройства…');
    const opts = all
      ? {acceptAllDevices: true, optionalServices: SERVICES}
      : {filters: [{namePrefix: 'BLEDDM'}, {namePrefix: 'ELK-BLE'}, {namePrefix: 'BLEDOM'}, {namePrefix: 'MELK'}], optionalServices: SERVICES};
    dev = await navigator.bluetooth.requestDevice(opts);
    await attach(dev);
  } catch (e) {
    const why = e && (e.message || e.name) ? (e.name ? e.name + ': ' : '') + (e.message || '') : String(e);
    setStatus('Не вышло (' + why + '). Если лента не нашлась, нажмите «Показать все устройства».', 'err');
  }
}

let reconnecting = false;
async function attach(d) {
  dev = d;
  try { localStorage.setItem(KEY + '.last', d.id); } catch (e) {}
  if (!d._hooked) {
    d._hooked = true;
    d.addEventListener('gattserverdisconnected', () => {
      stopMic(); chr = null; $('panel').classList.add('off');
      setStatus('Связь потеряна, переподключаюсь…', 'err');
      reconnect(d);
    });
  }
  setStatus('Подключение…');
  const server = await d.gatt.connect();
  const found = [];
  for (const s of await server.getPrimaryServices())
    for (const c of await s.getCharacteristics())
      if (c.properties.write || c.properties.writeWithoutResponse) found.push(c);
  if (!found.length) throw new Error('не найден канал для записи');
  chr = PREFER.map(p => found.find(c => c.uuid.includes(p))).find(Boolean) || found[0];
  $('panel').classList.remove('off');
  setStatus('Подключено: ' + d.name, 'ok');
  await turnOn();
}

// Повторные попытки к тому же устройству (после обрыва или обновления страницы).
async function reconnect(d, tries = 6) {
  if (reconnecting) return;
  reconnecting = true;
  for (let i = 0; i < tries && !chr; i++) {
    try { await attach(d); break; }
    catch (e) { setStatus('Ищу ленту… попытка ' + (i + 1) + ' из ' + tries, 'err'); await new Promise(r => setTimeout(r, 2000)); }
  }
  reconnecting = false;
  if (!chr) setStatus('Лента не найдена. Закройте duoCo Strip и нажмите «Подключить ленту».', 'err');
}

// При открытии страницы: подключиться к последней ленте без выбора из списка.
async function autoConnect() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
  try {
    const list = await navigator.bluetooth.getDevices();
    let last = null; try { last = localStorage.getItem(KEY + '.last'); } catch (e) {}
    const d = list.find(x => x.id === last) || list[0];
    if (d) { setStatus('Ищу последнюю ленту…'); reconnect(d); }
  } catch (e) {}
}

// ---------- Избранные цвета ----------
function renderFav() {
  const box = $('swatches');
  box.innerHTML = ''; box.classList.toggle('edit', editMode);
  if (!state.fav.length) {
    const d = document.createElement('div'); d.className = 'empty';
    d.textContent = 'Палитра пуста. Выберите цвет ниже и нажмите «Добавить в избранное».';
    box.appendChild(d);
  }
  state.fav.forEach((c, i) => {
    const b = document.createElement('button');
    b.style.background = c; b.setAttribute('aria-label', c);
    b.onclick = () => {
      if (editMode) { state.fav.splice(i, 1); save(); renderFav(); return; }
      stopMic(); $('picker').value = c; turnOn(); setRGB(...hex2rgb(c));
    };
    box.appendChild(b);
  });
  $('editFav').textContent = editMode ? 'Готово' : 'Изменить';
  $('editFav').classList.toggle('on', editMode);
}
$('editFav').onclick = () => { editMode = !editMode; renderFav(); };
$('addFav').onclick = () => {
  const c = $('picker').value;
  if (!state.fav.includes(c)) { state.fav.push(c); save(); }
  renderFav();
};
$('resetFav').onclick = () => {
  if (confirm('Вернуть стандартную палитру?')) { state.fav = DEFAULT_FAV.slice(); save(); renderFav(); }
};

$('connect').onclick = () => connect(false);
$('connectAll').onclick = () => connect(true);
$('on').onclick = turnOn;
$('off').onclick = () => { stopMic(); turnOff(); };
$('picker').oninput = e => { stopMic(); setRGB(...hex2rgb(e.target.value)); };
$('bright').oninput = e => { $('bval').textContent = e.target.value; send(pkt(0x01, +e.target.value, 0, 0, 0, 0)); };
$('speed').oninput = e => { $('sval').textContent = e.target.value; send(pkt(0x02, +e.target.value, 0, 0, 0, 0)); };
// Команды по порядку: send() оставляет только последнюю, поэтому здесь ждём каждую.
async function sendSeq(...ps) {
  for (const p of ps) {
    while (busy) await new Promise(r => setTimeout(r, 15));
    await send(p);
    while (busy) await new Promise(r => setTimeout(r, 15));
    await new Promise(r => setTimeout(r, 60));
  }
}
const R='#ff0000',G='#00ff00',B='#0000ff',Y='#ffff00',C='#00ffff',M='#ff00ff',W='#ffffff';
const ALL=[R,G,B,Y,C,M,W];
const EFFECTS = [
  ['Прыжки RGB', 'Резко меняет красный, зелёный, синий', [R,G,B]],
  ['Прыжки 7 цветов', 'Резкая смена всех семи цветов', ALL],
  ['Плавный RGB', 'Плавный переход красный, зелёный, синий', [R,G,B]],
  ['Плавные 7 цветов', 'Плавный переход по всем семи цветам', ALL],
  ['Дыхание красный', 'Красный плавно гаснет и загорается', [R]],
  ['Дыхание зелёный', 'Зелёный плавно гаснет и загорается', [G]],
  ['Дыхание синий', 'Синий плавно гаснет и загорается', [B]],
  ['Дыхание жёлтый', 'Жёлтый плавно гаснет и загорается', [Y]],
  ['Дыхание голубой', 'Голубой плавно гаснет и загорается', [C]],
  ['Дыхание фиолетовый', 'Фиолетовый плавно гаснет и загорается', [M]],
  ['Дыхание белый', 'Белый плавно гаснет и загорается', [W]],
  ['Красный ↔ зелёный', 'Плавно перетекает между двумя цветами', [R,G]],
  ['Красный ↔ синий', 'Плавно перетекает между двумя цветами', [R,B]],
  ['Зелёный ↔ синий', 'Плавно перетекает между двумя цветами', [G,B]],
  ['Мигание 7 цветов', 'Быстро мигает всеми семью цветами', ALL],
  ['Мигание красный', 'Резко вспыхивает и гаснет', [R]],
  ['Мигание зелёный', 'Резко вспыхивает и гаснет', [G]],
  ['Мигание синий', 'Резко вспыхивает и гаснет', [B]],
  ['Мигание жёлтый', 'Резко вспыхивает и гаснет', [Y]],
  ['Мигание голубой', 'Резко вспыхивает и гаснет', [C]],
  ['Мигание фиолетовый', 'Резко вспыхивает и гаснет', [M]],
  ['Мигание белый', 'Резко вспыхивает и гаснет', [W]]
];
let curFx = -1;
EFFECTS.forEach(([name, desc, cols], i) => {
  const b = document.createElement('button');
  b.innerHTML = '<div class="dots"></div><span class="n"></span>';
  b.querySelector('.n').textContent = name;
  cols.forEach(c => { const d = document.createElement('i'); d.style.background = c; b.querySelector('.dots').appendChild(d); });
  b.onclick = () => {
    stopMic(); curFx = i; $('fxinfo').innerHTML = '<b>' + name + '.</b> ' + desc; $('glow').classList.add('fxrun'); $('glow').style.opacity = .5;
    document.querySelectorAll('#fx button').forEach((x, k) => x.classList.toggle('on', k === i));
    sendSeq(pkt(0x04, 0xf0, 0x00, 0x01, 0xff, 0x00),
            pkt(0x03, 0x87 + i, 0x03, 0, 0, 0),
            pkt(0x02, +$('speed').value, 0, 0, 0, 0));
  };
  b.onmouseenter = () => { if (curFx < 0) $('fxinfo').innerHTML = '<b>' + name + '.</b> ' + desc; };
  $('fx').appendChild(b);
});

// ---------- Цвета полос для режима «под звук» ----------
function renderBands() {
  const box = $('bands'); box.innerHTML = '';
  BAND_DEF.forEach((def, i) => {
    const c = state.bands[i];
    const d = document.createElement('div'); d.className = 'band' + (c ? '' : ' none');
    d.innerHTML = '<div class="top"><span class="name"></span><div class="ctl"></div></div>' +
                  '<div class="ctl"><input type="color"><button class="small take">Взять выбранный</button></div>';
    d.querySelector('.name').textContent = def.name + (c ? '' : ' — пусто');
    const input = d.querySelector('input'); input.value = c || '#ffffff';
    input.oninput = () => { state.bands[i] = input.value; save(); };
    input.onchange = () => { renderBands(); };
    const toggle = document.createElement('button'); toggle.className = 'small';
    toggle.textContent = c ? 'Убрать' : 'Добавить';
    toggle.onclick = () => { state.bands[i] = c ? null : ($('picker').value); save(); renderBands(); };
    d.querySelector('.top .ctl').appendChild(toggle);
    d.querySelector('.take').onclick = () => { state.bands[i] = $('picker').value; save(); renderBands(); };
    box.appendChild(d);
  });
}

const PRESETS = [
  ['Розовый · красный · жёлтый', ['#ff0078', '#ff0000', '#ffc800']],
  ['Огонь', ['#ff0000', '#ff5000', '#ffc800']],
  ['Контраст', ['#a000ff', '#00ffff', '#ffc800']],
  ['Холод', ['#0000ff', '#00b4ff', '#ffffff']],
  ['Неон', ['#ff0078', '#00ffff', '#a000ff']],
  ['Закат', ['#a000ff', '#ff0078', '#ff8c28']],
  ['Один розовый', ['#ff0078', null, null]],
  ['Один фиолетовый', ['#a000ff', null, null]]
];
PRESETS.forEach(([name, cols]) => {
  const b = document.createElement('button'); b.className = 'small'; b.textContent = name;
  b.onclick = () => { state.bands = cols.slice(); save(); renderBands(); };
  $('presets').appendChild(b);
});

// ---------- Режим «под звук» ----------
let ac, stream, timer, rawBass = 0, hist = [], beats = 0, lastBeat = 0, flash = 0, ci = 0;
$('sndMode').value = state.snd.mode;
[['smax', 'max', 'smaxv'], ['smin', 'min', 'sminv'], ['sgain', 'gain', 'sgainv']].forEach(([id, key, out]) => {
  $(id).value = state.snd[key]; $(out).textContent = state.snd[key];
  $(id).oninput = e => { state.snd[key] = +e.target.value; $(out).textContent = e.target.value; save(); };
});
$('sndMode').onchange = e => { state.snd.mode = e.target.value; save(); };
const peak = [1e-6, 1e-6, 1e-6, 1e-6], level = [0, 0, 0, 0];
async function startMic() {
  if (!state.bands.some(Boolean)) { setStatus('Задайте цвет хотя бы одной полосе.', 'err'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('Микрофон здесь недоступен: странице нужен https.', 'err'); return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
  } catch (e) { setStatus('Нет доступа к микрофону: ' + e.message, 'err'); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const an = ac.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0.1; an.minDecibels = -90; an.maxDecibels = -25;
  ac.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.frequencyBinCount), hz = ac.sampleRate / an.fftSize;
  const ranges = [...BAND_DEF.map(b => [b.lo, b.hi]), [30, 12000]]; // 4-я — весь звук сразу
  turnOn(); micOn = true; $('mic').textContent = 'Выключить режим'; $('mic').classList.add('on');
  timer = setInterval(() => {
    an.getByteFrequencyData(buf);
    ranges.forEach(([lo, hi], i) => {
      let s = 0; for (let k = Math.floor(lo / hz); k < hi / hz && k < buf.length; k++) s += buf[k];
      if (i === 0) rawBass = s;
      peak[i] = Math.max(s, peak[i] * 0.995, 1e-6);
      const n = Math.pow(Math.min(s / peak[i], 1), 2);
      level[i] = n > level[i] ? n : level[i] * 0.8 + n * 0.2;
    });
    const active = [0, 1, 2].filter(i => state.bands[i]);
    if (!active.length) return setRGB(0, 0, 0);
    const g = state.snd.gain / 100, floor = state.snd.min / 100, top = state.snd.max / 100;
    const shape = k => top * (floor + (1 - floor) * Math.min(1, k * g));  // яркость: потолок и фон задаёт пользователь
    let rgb;
    if (state.snd.mode === 'bands') {
      if (active.length === 1) {               // один цвет — на весь звук
        rgb = hex2rgb(state.bands[active[0]]).map(v => Math.round(v * shape(level[3])));
      } else {                                 // несколько — каждая полоса своим цветом
        const tot = active.reduce((a, i) => a + level[i], 0), mx = Math.max(...active.map(i => level[i]));
        if (tot < 1e-3) return setRGB(...[0, 1, 2].map(() => Math.round(255 * 0)));
        const k = shape(mx);
        rgb = [0, 1, 2].map(c => Math.round(active.reduce((a, i) => a + level[i] * hex2rgb(state.bands[i])[c], 0) / tot * k));
      }
    } else {                                   // вспышки на бит басов
      const now = performance.now(), bass = rawBass;
      hist.push(bass); if (hist.length > 20) hist.shift();       // ~1.4 с истории
      const mean = hist.reduce((a, b) => a + b, 0) / hist.length;
      const sd = Math.sqrt(hist.reduce((a, b) => a + (b - mean) * (b - mean), 0) / hist.length);
      const c = Math.min(2.5, Math.max(0.6, 3 - state.snd.gain / 100));  // выше чувствительность — ниже порог
      if (bass > mean + c * sd && bass > mean * 1.08 && bass > 30 && now - lastBeat > 200) {
        lastBeat = now; flash = 1; beats++;
        if (state.snd.mode === 'cycle') ci++;
        setStatus('Бит: ' + beats, 'ok');
      }
      flash *= 0.82;
      const col = state.snd.mode === 'cycle' ? state.bands[active[ci % active.length]] : state.bands[active[0]];
      const k = shape(flash / g);              // вспышка не зависит от громкости, только от бита
      rgb = hex2rgb(col).map(v => Math.round(v * k));
    }
    setRGB(...rgb);
  }, 70);
}
function stopMic() {
  if (!micOn) return;
  micOn = false; clearInterval(timer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ac) ac.close();
  $('mic').textContent = 'Включить режим'; $('mic').classList.remove('on');
}
$('mic').onclick = () => micOn ? stopMic() : startMic();

const TABS = ['color', 'fxt', 'snd'];
document.querySelectorAll('#tabs button').forEach((b, i) => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('act', x === b));
  TABS.forEach(t => $('tab-' + t).classList.toggle('act', t === b.dataset.t));
  $('ind').style.transform = 'translateX(' + (i * 100) + '%)';
});
renderFav(); renderBands(); autoConnect();
</script>
